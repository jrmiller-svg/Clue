<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Clue Notepad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17624f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A digital Clue / Cluedo detective notepad: mark the sheet yourself, keep a turn log, hide it from the table.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Special+Elite&display=swap">
<style>
/* Layout: the paper detective sheet — sticky header, the grid, a pen tray and tab bar at the thumb. */
:root {
  --paper: #eef1ef;
  --card: #ffffff;
  --ink: #1b2230;
  --muted: #5a6670;
  --line: #d3dad6;
  --felt: #17624f;
  --felt-soft: #dcebe5;
  --stamp: #b42318;
  --stamp-soft: #f8e1de;
  --brass: #9a6410;
  --brass-soft: #f6ead2;
  --chip: #f7f8f6;
  --on-felt: #ffffff;
  --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 4px 16px rgba(20, 30, 40, .06);
  --font-display: "Special Elite", "Courier New", ui-monospace, monospace;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tabbar-h: 62px;
  --tray-h: 64px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1412; --card: #161f1c; --ink: #e5ece9; --muted: #95a49e; --line: #2a3733;
    --felt: #43b48f; --felt-soft: #173a30; --stamp: #ff6d5c; --stamp-soft: #3d1c19;
    --brass: #e3a940; --brass-soft: #3a2c12; --chip: #1c2622; --on-felt: #0e1412;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1412; --card: #161f1c; --ink: #e5ece9; --muted: #95a49e; --line: #2a3733;
  --felt: #43b48f; --felt-soft: #173a30; --stamp: #ff6d5c; --stamp-soft: #3d1c19;
  --brass: #e3a940; --brass-soft: #3a2c12; --chip: #1c2622; --on-felt: #0e1412;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body, button, a, input, select, textarea, label { touch-action: pan-x pan-y; }
input[type="text"], select, textarea { font-size: 16px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--felt) 55%, transparent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--font-body); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-top: -2px; }
.grow { flex: 1; min-width: 0; }
.icon-btn { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; min-width: 40px; height: 40px; padding: 0 10px; display: inline-grid; place-items: center; font-size: 15px; font-weight: 600; line-height: 1; }
.icon-btn.big { font-size: 20px; }

main { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  padding-block: 14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.with-tray { padding-bottom: calc(var(--tabbar-h) + var(--tray-h) + 28px + env(safe-area-inset-bottom, 0px)); }
main.no-tabs { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sheet h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h3 { margin: 0; font-size: 15px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
/* sheet header stays one line so switching pens never shifts the grid */
.sheet-head { flex-wrap: nowrap; }
.sheet-head h2 { flex: none; }
.pen-help { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 8px 11px; min-height: 40px; font-size: 14px; line-height: 1.15; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); border-color: var(--felt); }
.chip .tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 5px; border-radius: 5px; background: var(--felt-soft); color: var(--felt); }
.chip[aria-pressed="true"] .tag { background: rgba(255,255,255,.22); color: inherit; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 11px 16px; font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--felt); border-color: var(--felt); color: var(--on-felt); }
.btn.primary:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; }
.btn.danger { color: var(--stamp); }
.btn.block { width: 100%; }
.linkish { background: none; border: 0; color: var(--felt); font-weight: 600; padding: 4px 2px; font-size: 13px; }
input[type="text"], select, textarea { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 9px 11px; min-height: 42px; width: 100%; min-width: 0; }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
textarea.mono { font-family: var(--font-data); font-size: 13px; }
.prow { display: flex; gap: 6px; align-items: center; }
.prow input[type="text"] { flex: 1 1 0; width: auto; }
.prow > * { flex: none; }

/* the sheet grid */
.grid-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
.grid th, .grid td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
.grid thead th { font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 2px; white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
.grid thead th .cnt { display: block; font-family: var(--font-data); font-weight: 500; font-size: 10px; color: var(--felt); }
.grid thead th.me { color: var(--felt); }
.grid th.card { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; padding: 0 6px 0 0; max-width: 140px; }
.grid th.card button { all: unset; box-sizing: border-box; display: block; padding: 10px 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; font-size: 14px; }
.grid th.card button.out { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.grid th.card button.hot span { border: 2px solid var(--stamp); border-radius: 999px; padding: 1px 7px; color: var(--stamp); font-weight: 600; }
.grid tr.cat th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; position: sticky; left: 0; background: var(--card); }
.grid td { min-width: 42px; height: 42px; }
.grid td button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; place-items: center; position: relative; width: calc(100% - 4px); height: 36px; margin: 2px; border-radius: 7px; background: var(--chip); font-size: 17px; font-weight: 700; }
.grid td button.m-x { color: var(--muted); background: transparent; font-weight: 500; font-size: 19px; }
.grid td button.m-y { background: var(--felt); color: var(--on-felt); }
.grid td button.m-q { background: var(--brass-soft); color: var(--brass); }
.grid td button .tags { position: absolute; top: 2px; right: 4px; font-family: var(--font-data); font-size: 11px; font-weight: 600; color: var(--stamp); line-height: 1; letter-spacing: -.02em; }
.grid td button.m-y .tags { color: var(--on-felt); }
.grid td button:focus-visible { outline-offset: 0; }
.legend { display: flex; gap: 10px 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 20px; border-radius: 5px; margin-right: 3px; font-weight: 700; vertical-align: middle; }

/* pen tray */
.tray { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--card); border-top: 1px solid var(--line);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.tray-in { max-width: 680px; margin: 0 auto; height: var(--tray-h); display: flex; align-items: center; gap: 6px; }
.pen { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; height: 46px; min-width: 46px; padding: 0 8px; font-size: 19px; font-weight: 700; display: grid; place-items: center; flex: 1 1 0; }
.pen[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--card); }
.pen.y { color: var(--felt); } .pen.q { color: var(--brass); } .pen.t { color: var(--stamp); font-family: var(--font-data); font-size: 16px; } .pen.x { color: var(--muted); }
.pen.e, .pen.u { font-size: 14px; font-weight: 600; }
.numstrip { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--tray-h) + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--card); border-top: 1px solid var(--line); padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.numstrip .chips { max-width: 680px; margin: 0 auto; }
.numstrip .chip { min-width: 40px; justify-content: center; font-family: var(--font-data); }

/* turn log */
.turns { display: flex; flex-direction: column; gap: 8px; }
.turn { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); display: flex; gap: 10px; }
.turn .n { font-family: var(--font-data); color: var(--muted); font-size: 12px; min-width: 26px; padding-top: 2px; }
.turn .body { flex: 1; min-width: 0; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--felt); }

/* privacy cover */
.cover { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; text-align: center; color: var(--ink);
  background: repeating-linear-gradient(45deg, var(--paper) 0 14px, var(--chip) 14px 28px); }
.cover button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px; }
.cover .seal { font-family: var(--font-display); font-size: 26px; color: var(--stamp); border: 3px solid var(--stamp); border-radius: 8px; padding: 6px 14px 2px; transform: rotate(-4deg); background: var(--card); }

.scrim { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 680px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--tray-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 600; color: var(--felt); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="app"></div>

<script>
(function () {
  'use strict';
  // no zooming: block pinch (iOS gesture events) and double-tap; scrolling is unaffected
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

  var EDITIONS = {
    classic: { label: 'Clue — classic (Mrs. White)', cats: [
      ['Suspect', ['Miss Scarlet', 'Colonel Mustard', 'Mrs. White', 'Mr. Green', 'Mrs. Peacock', 'Professor Plum']],
      ['Weapon', ['Candlestick', 'Knife', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench']],
      ['Room', ['Hall', 'Lounge', 'Dining Room', 'Kitchen', 'Ballroom', 'Conservatory', 'Billiard Room', 'Library', 'Study']]] },
    modern: { label: 'Clue — 2016+ (Dr. Orchid)', cats: [
      ['Suspect', ['Miss Scarlet', 'Colonel Mustard', 'Dr. Orchid', 'Mr. Green', 'Mrs. Peacock', 'Professor Plum']],
      ['Weapon', ['Candlestick', 'Dagger', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench']],
      ['Room', ['Hall', 'Lounge', 'Dining Room', 'Kitchen', 'Ballroom', 'Conservatory', 'Billiard Room', 'Library', 'Study']]] },
    cluedo: { label: 'Cluedo — UK', cats: [
      ['Suspect', ['Miss Scarlett', 'Colonel Mustard', 'Mrs White', 'Reverend Green', 'Mrs Peacock', 'Professor Plum']],
      ['Weapon', ['Candlestick', 'Dagger', 'Lead Piping', 'Revolver', 'Rope', 'Spanner']],
      ['Room', ['Hall', 'Lounge', 'Dining Room', 'Kitchen', 'Ballroom', 'Conservatory', 'Billiard Room', 'Library', 'Study']]] },
    master: { label: 'Clue — Master Detective', cats: [
      ['Suspect', ['Miss Scarlet', 'Colonel Mustard', 'Mrs. White', 'Mr. Green', 'Mrs. Peacock', 'Professor Plum', 'Madame Rose', 'Sergeant Gray', 'Monsieur Brunette', 'Miss Peach']],
      ['Weapon', ['Candlestick', 'Knife', 'Lead Pipe', 'Revolver', 'Rope', 'Wrench', 'Horseshoe', 'Poison']],
      ['Room', ['Carriage House', 'Conservatory', 'Kitchen', 'Trophy Room', 'Dining Room', 'Drawing Room', 'Gazebo', 'Courtyard', 'Fountain', 'Library', 'Billiard Room', 'Studio']]] }
  };
  var MARKS = { x: '×', y: '✓', q: '?' };

  // ------------------------------------------------------------ state
  var KEY = 'clue-notepad/v1';
  var S = { game: null, game0: null, setup: null, tab: 'sheet', pen: 'x', tagNum: 1, numOpen: false, hidden: false, undo: [], form: null, modal: null, toast: null, confirmDel: null };
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ game: S.game, game0: S.game ? null : S.game0, setup: S.game ? null : S.setup, tab: S.tab, pen: S.pen, tagNum: S.tagNum })); } catch (e) { /* storage unavailable */ }
  }
  function restore() {
    try {
      var d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!d) return;
      if (d.game && d.game.categories) S.game = d.game;
      if (d.game0 && d.game0.categories) S.game0 = d.game0;
      if (d.setup) S.setup = d.setup;
      if (d.tab) S.tab = d.tab;
      if (d.pen) S.pen = d.pen;
      if (d.tagNum) S.tagNum = d.tagNum;
    } catch (e) { /* ignore */ }
  }

  // ------------------------------------------------------------ helpers
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) addOne(el, arguments[i]);
    return el;
  }
  function add(el) { for (var i = 1; i < arguments.length; i++) addOne(el, arguments[i]); }
  function addOne(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { addOne(el, x); }); return; }
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function deck(g) {
    var names = [], byCat = [];
    g.categories.forEach(function (c) { var a = []; c.cards.forEach(function (n) { a.push(names.length); names.push(n); }); byCat.push(a); });
    return { names: names, byCat: byCat };
  }
  function shortName(i) { return i === S.game.me ? 'You' : S.game.players[i].name; }
  function toast(msg) {
    S.toast = msg; renderToast();
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { S.toast = null; renderToast(); }, 2000);
  }

  // ------------------------------------------------------------ render
  var app = document.getElementById('app');
  function render() {
    persist();
    app.innerHTML = '';
    app.appendChild(viewHeader());
    if (!S.game) { app.appendChild(viewSetup()); renderModal(); renderToast(); return; }
    var main = h('main', { class: S.tab === 'sheet' ? 'with-tray' : '' });
    if (S.tab === 'sheet') add(main, viewSheet());
    else if (S.tab === 'turns') add(main, viewTurns());
    else add(main, viewScratch());
    app.appendChild(main);
    if (S.tab === 'sheet') { app.appendChild(viewTray()); if (S.numOpen) app.appendChild(viewNumStrip()); }
    app.appendChild(viewTabs());
    if (S.hidden) app.appendChild(viewCover());
    renderModal(); renderToast();
  }

  function viewHeader() {
    return h('header', { class: 'top' }, h('div', { class: 'top-in' },
      h('div', { class: 'brand' }, 'Notepad', h('small', null, 'Clue detective notes')),
      h('div', { class: 'grow' }),
      S.game ? h('button', { class: 'icon-btn', onclick: function () { S.hidden = true; render(); } }, 'Hide') : null,
      S.game ? h('button', { class: 'icon-btn big', 'aria-label': 'Menu', onclick: function () { S.modal = { kind: 'menu' }; renderModal(); } }, '⋯') : null));
  }

  var ICONS = {
    sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
    turns: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
    scratch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };
  function viewTabs() {
