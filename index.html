<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Clue Case Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17624f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Clue / Cluedo solver: log turns, get exact probabilities for the envelope, and know when to accuse.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Special+Elite&display=swap">
<style>
/* Layout: one column "case file" — sticky header, scrolling sheet, fixed tab bar at the thumb. */
:root {
  --paper: #eef1ef;      /* scorepad paper, faint felt-green bias */
  --card: #ffffff;
  --ink: #1b2230;        /* navy pen ink */
  --muted: #5a6670;
  --line: #d3dad6;
  --felt: #17624f;       /* billiard-table green: primary action */
  --felt-soft: #dcebe5;
  --stamp: #b42318;      /* envelope / solution red */
  --stamp-soft: #f8e1de;
  --brass: #9a6410;      /* strong lead */
  --brass-soft: #f6ead2;
  --chip: #f7f8f6;
  --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 4px 16px rgba(20, 30, 40, .06);
  --font-display: "Special Elite", "Courier New", ui-monospace, monospace;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tabbar-h: 62px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1412; --card: #161f1c; --ink: #e5ece9; --muted: #95a49e; --line: #2a3733;
    --felt: #43b48f; --felt-soft: #173a30; --stamp: #ff6d5c; --stamp-soft: #3d1c19;
    --brass: #e3a940; --brass-soft: #3a2c12; --chip: #1c2622;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1412; --card: #161f1c; --ink: #e5ece9; --muted: #95a49e; --line: #2a3733;
  --felt: #43b48f; --felt-soft: #173a30; --stamp: #ff6d5c; --stamp-soft: #3d1c19;
  --brass: #e3a940; --brass-soft: #3a2c12; --chip: #1c2622;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body, button, a, input, select, textarea, label { touch-action: pan-x pan-y; }
input[type="text"], select, textarea { font-size: 16px; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--card);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--felt) 55%, transparent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--font-body); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-top: -2px; }
.top .grow { flex: 1; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 10px;
  font-size: 13px; font-weight: 600; background: var(--chip); border: 1px solid var(--line); white-space: nowrap;
}
.pill.solved { background: var(--stamp); color: #fff; border-color: transparent; }
.pill.lead { background: var(--brass-soft); color: var(--brass); border-color: transparent; }
.pill.busy::after { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px; line-height: 1; }

/* page */
main {
  max-width: 680px; margin: 0 auto;
  padding-block: 14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
main.no-tabs { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sheet h2, .h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h3 { margin: 0; font-size: 15px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--chip); border-radius: 10px;
  padding: 8px 11px; min-height: 40px; font-size: 14px; line-height: 1.15; text-align: left;
  display: inline-flex; align-items: center; gap: 6px; position: relative;
}
.chip[aria-pressed="true"] { background: var(--felt); color: #fff; border-color: var(--felt); }
:root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: var(--card); }
:root[data-theme="light"] .chip[aria-pressed="true"] { color: #fff; }
.chip .tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 5px; border-radius: 5px; background: var(--felt-soft); color: var(--felt); }
.chip[aria-pressed="true"] .tag { background: rgba(255,255,255,.22); color: inherit; }
.chip.dim { opacity: .55; }
.chip:disabled { opacity: .4; cursor: not-allowed; }
.chip.wide { flex: 1 1 auto; justify-content: center; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 12px; padding: 11px 16px; font-weight: 600; min-height: 46px; }
.btn.primary { background: var(--felt); border-color: var(--felt); color: #fff; }
:root:not([data-theme="light"]) .btn.primary { color: var(--card); }
:root[data-theme="light"] .btn.primary { color: #fff; }
.btn.danger { color: var(--stamp); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary:disabled { opacity: 1; background: var(--line); border-color: var(--line); color: var(--muted); }
.linkish { background: none; border: 0; color: var(--felt); font-weight: 600; padding: 4px 2px; font-size: 13px; }
.save-bar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; flex-direction: column; gap: 6px; padding-block: 14px 10px; margin-top: -14px; background: linear-gradient(to bottom, transparent, var(--paper) 18px); }
.save-bar .hint { text-align: center; font-size: 12px; color: var(--muted); align-self: center; }

input[type="range"] { accent-color: var(--felt); }
input[type="checkbox"] { accent-color: var(--felt); width: 18px; height: 18px; }
input[type="text"], select, textarea {
  border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 9px 11px; min-height: 42px; width: 100%; min-width: 0;
}
textarea { min-height: 120px; font-family: var(--font-data); font-size: 13px; resize: vertical; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.prow { display: flex; gap: 6px; align-items: center; }
.prow input[type="text"] { flex: 1 1 0; width: auto; }
.prow > .chip, .prow > .linkish, .prow > .stack { flex: none; }
.stepper button { border: 0; background: var(--chip); width: 36px; height: 40px; font-size: 18px; }
.stepper span { min-width: 30px; text-align: center; font-weight: 600; }

/* status card */
.case {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
}
.case.solved { border-color: var(--stamp); box-shadow: 0 0 0 2px var(--stamp-soft); }
.case.lead { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass-soft); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
.slot .k { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slot .v { font-weight: 600; font-size: 14px; line-height: 1.2; margin-top: 2px; overflow-wrap: anywhere; }
.slot .p { font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-top: 3px; }
.slot.sure { background: var(--stamp-soft); border-color: transparent; }
.slot.sure .p { color: var(--stamp); font-weight: 600; }
.verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict .big { font-family: var(--font-data); font-weight: 600; font-size: 26px; line-height: 1; }
.stamp {
  font-family: var(--font-display); color: var(--stamp); border: 2px solid var(--stamp); border-radius: 6px;
  padding: 2px 8px 0; transform: rotate(-3deg); display: inline-block; letter-spacing: .08em; font-size: 15px;
}

.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.bad { background: var(--stamp-soft); color: var(--ink); border: 1px solid var(--stamp); }
.banner.good { background: var(--stamp); color: #fff; }
.banner.warm { background: var(--brass-soft); border: 1px solid var(--brass); }
.banner b { display: block; }
.banner .grow { flex: 1; min-width: 0; }

/* bars */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: -4px; }
.bar .fill { height: 100%; background: var(--stamp); border-radius: 3px; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .val { text-align: right; font-family: var(--font-data); font-size: 13px; }
.bar.out { color: var(--muted); }
.bar.out .lbl { text-decoration: line-through; }

/* suggestion list */
.sugg { display: flex; flex-direction: column; gap: 8px; }
.sg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--chip); display: flex; flex-direction: column; gap: 6px; }
.sg .title { font-weight: 600; min-width: 0; }
.sg .bits { white-space: nowrap; font-family: var(--font-data); font-size: 13px; }
.sg .meter { height: 6px; border-radius: 3px; background: var(--card); overflow: hidden; }
.sg .meter i { display: block; height: 100%; background: var(--felt); }
.sg .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

/* notes grid */
.grid-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.grid th, .grid td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
.grid thead th { font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 2px; letter-spacing: .02em; white-space: nowrap; max-width: 56px; overflow: hidden; text-overflow: ellipsis; }
.grid thead th.env { color: var(--stamp); }
.grid th.card { text-align: left; font-weight: 500; position: sticky; left: 0; background: var(--card); z-index: 1; padding: 0 6px 0 0; max-width: 132px; }
.grid th.card button { all: unset; display: block; padding: 9px 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.grid tr.cat th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 12px 0 4px; position: sticky; left: 0; background: var(--card); }
.grid td { min-width: 38px; height: 38px; }
.cell { display: grid; place-items: center; height: 34px; margin: 2px; border-radius: 7px; font-family: var(--font-data); font-size: 12px; }
.cell.yes { background: var(--felt); color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 15px; }
:root:not([data-theme="light"]) .cell.yes { color: var(--card); }
:root[data-theme="light"] .cell.yes { color: #fff; }
.cell.no { color: var(--line); font-family: var(--font-body); font-size: 15px; }
.cell.env.yes { background: var(--stamp); }
.grid tr.solved th.card { color: var(--stamp); font-weight: 700; }
.grid tr.mine th.card button { color: var(--felt); font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend .cell { width: 26px; height: 22px; margin: 0; display: inline-grid; vertical-align: middle; }

/* history */
.hist { display: flex; flex-direction: column; gap: 8px; }
.ev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); display: flex; gap: 10px; }
.ev.bad { border-color: var(--stamp); background: var(--stamp-soft); }
.ev .n { font-family: var(--font-data); color: var(--muted); font-size: 12px; min-width: 26px; padding-top: 2px; }
.ev .body { flex: 1; min-width: 0; }
.ev .acts { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

/* tab bar */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--felt); }
.tabs button .dot { position: absolute; top: 9px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); }

/* modal sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.modal {
  background: var(--card); width: 100%; max-width: 680px; max-height: 88vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px;
}
.modal .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 600; color: var(--felt); font-size: 14px; }
.kbd { font-family: var(--font-data); font-size: 12px; background: var(--chip); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.prose p { margin: 0 0 8px; }
.prose p:last-child { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 560px) { .slot .v { font-size: 15px; } }
</style>

<script id="engine-src">
/*
 * Clue Solver engine
 * -------------------
 * Exact Bayesian inference for Clue / Cluedo.
 *
 * Model: the deal is uniformly random (one card of each category goes in the
 * envelope, the rest are shuffled and dealt with known hand sizes). Every
 * logged event is a hard constraint on the deal:
 *   - a player who passes holds none of the three suggested cards
 *   - a player who refutes holds at least one of them (exactly the card, if
 *     you saw it)
 *   - a wrong accusation means that exact triple is not the solution
 *   - your own hand and any face-up cards are known
 * Under a uniform prior, P(anything | log) = (# consistent deals where it is
 * true) / (# consistent deals). This engine counts consistent deals EXACTLY
 * with a dynamic program over players, so the probabilities are exact (no
 * sampling error). For very large decks it falls back to MCMC sampling.
 *
 * Works in browsers (window / Web Worker) and Node (module.exports).
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.ClueEngine = api;
})(typeof self !== 'undefined' ? self : typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var UNKNOWN = -1, NO = 0, YES = 1;
  var PUBLIC = -2; // owner code for face-up cards in samples

  // ---------------------------------------------------------------- utils
  function popcount(x) {
    x = x - ((x >>> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    return Math.imul((x + (x >>> 4)) & 0x0f0f0f0f, 0x01010101) >>> 24;
  }
  function bitList(x) {
    var out = [];
    while (x) { var b = x & -x; out.push(31 - Math.clz32(b)); x ^= b; }
    return out;
  }
  function binom(n, k) {
    if (k < 0 || k > n) return 0;
    if (k > n - k) k = n - k;
    var r = 1;
    for (var i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
    return Math.round(r);
  }
  function now() {
    return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
  }
  function makeRng(seed) {
    var a = (seed >>> 0) || 0x9e3779b9;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashString(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // Enumerate k-subsets of the bit positions in `pos`; write masks that hit
  // every clause mask into buf starting at offset n. Returns new count.
  var SCR_IDX = new Int32Array(32), SCR_PREF = new Int32Array(33);
  function combosInto(pos, k, clauses, buf, n) {
    var len = pos.length;
    if (k > len) return n;
    var nc = clauses.length;
    if (k === 0) {
      if (nc === 0) buf[n++] = 0;
      return n;
    }
    var idx = SCR_IDX, pref = SCR_PREF;
    var i, j;
    for (i = 0; i < k; i++) { idx[i] = i; pref[i + 1] = pref[i] | (1 << pos[i]); }
    for (;;) {
      var H = pref[k];
      var ok = true;
      for (j = 0; j < nc; j++) if ((H & clauses[j]) === 0) { ok = false; break; }
      if (ok) buf[n++] = H;
      i = k - 1;
      while (i >= 0 && idx[i] === len - k + i) i--;
      if (i < 0) return n;
      idx[i]++;
      pref[i + 1] = pref[i] | (1 << pos[idx[i]]);
      for (j = i + 1; j < k; j++) { idx[j] = idx[j - 1] + 1; pref[j + 1] = pref[j] | (1 << pos[idx[j]]); }
    }
  }
  // positions of set bits, into a reusable array
  var SCR_POS = new Int32Array(32);
  function bitsInto(x, arr) {
    var n = 0;
    while (x) { var b = x & -x; arr[n++] = 31 - Math.clz32(b); x ^= b; }

    // ---- backward pass (marginals for the forward players)
    for (i = fwd.length; i >= 1; i--) {
      var plb = fwd[i - 1], pv = tables[i - 1], cur = tables[i];
      pv.b = new Float64Array(pv.cap);
      var marg = new Float64Array(u);
      for (var s2 = 0; s2 < pv.cap; s2++) {
        var M2 = pv.keys[s2];
        if (M2 === -1) continue;
        var f2 = pv.f[s2];
        var n2 = enumHands(plb, M2, full, buf);
        var bsum = 0;
        for (var h2 = 0; h2 < n2; h2++) {
          var H2 = buf[h2];
          var vb = cur.b[cur.find(M2 | H2)];
          if (vb) {
            bsum += vb;
            var w2 = f2 * vb, x2 = H2;
            while (x2) { var b2 = x2 & -x2; marg[31 - Math.clz32(b2)] += w2; x2 ^= b2; }
          }
        }
        pv.b[s2] = bsum;
      }
      plb.marg = marg;
    }
    if (last) last.marg = margLast;
    if (opts.debug) opts.debug.tBack = now();

    return {
      total: total, multiplier: multiplier, tables: tables, fwd: fwd, last: last, tripleW: tripleW, tripleMap: tripleMap,
      margEnv: margEnv, buf: buf, work: work
    };
  }

  function enumHands(pl, M, full, buf) {
    var n = 0;
    if (pl.useList) {
      var L = pl.list, len = L.length;
      for (var i = 0; i < len; i++) { var H = L[i]; if ((H & M) === 0) buf[n++] = H; }

    return combosInto(bitsInto(full & ~M & pl.allowed, SCR_POS), pl.need, pl.clauses, buf, 0);
  }

  // write a hand into a sample row; a merged group's cards are dealt to its
  // members uniformly at random (every split is equally consistent)
  function assignHand(row, pl, H, red, rand) {
    var bits = bitList(H), i;
    if (!pl.members) { for (i = 0; i < bits.length; i++) row[red.cardOfBit[bits[i]]] = pl.p; return; }
    for (i = bits.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)), t = bits[i]; bits[i] = bits[j]; bits[j] = t; }
    var k = 0;
    pl.members.forEach(function (mb) { for (var q = 0; q < mb.need; q++) row[red.cardOfBit[bits[k++]]] = mb.p; });
  }

  // draw exact uniform samples of consistent deals from the DP tables
  function sampleExact(pr, red, ex, nSamples, rand) {
    var N = pr.N, P = pr.P, ENV = pr.ENV, K = pr.K;
    var base = new Int8Array(N);
    var c, o;
    for (c = 0; c < N; c++) {
      if (pr.pub[c]) { base[c] = PUBLIC; continue; }
      base[c] = -1;
      for (o = 0; o <= P; o++) if (K[o * N + c] === YES) { base[c] = o; break; }
    }
    var out = new Int8Array(nSamples * N);
    var T = ex.tables[ex.tables.length - 1];
    var slots = [], cum = [], acc = 0;
    for (var s = 0; s < T.cap; s++) {
      if (T.keys[s] === -1 || !T.b[s]) continue;
      acc += T.f[s] * T.b[s];
      slots.push(s); cum.push(acc);
    }
    if (!acc) return { samples: out, n: 0 };
    var full = red.full, envCats = red.envCats, nEC = envCats.length, last = ex.last;
    var lastF = last ? last.F : 0, lastCl = last ? last.clauses : [];
    var baseCards = red.envKnown.slice();
    for (var k = 0; k < nSamples; k++) {
      var row = out.subarray(k * N, k * N + N);
      row.set(base);
      // pick final state
      var r = rand() * acc, lo = 0, hi = cum.length - 1;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (cum[mid] > r) hi = mid; else lo = mid + 1; }
      var M = T.keys[slots[lo]];
      var R = full & ~M;
      // pick envelope completion uniformly
      var comps = [];
      var cands = [], okc = true, e;
      for (e = 0; e < nEC; e++) { var cb = bitList(R & envCats[e].cand); if (!cb.length) { okc = false; break; } cands.push(cb); }
      if (okc) {
        var ci2 = new Int32Array(nEC);
        for (;;) {
          var E = 0;
          for (e = 0; e < nEC; e++) { var bit = cands[e][ci2[e]]; E |= 1 << bit; baseCards[envCats[e].ci] = red.cardOfBit[bit]; }
          var rest = R & ~E, valid = (rest & lastF) === 0;
          if (valid) for (var q = 0; q < lastCl.length; q++) if ((rest & lastCl[q]) === 0) { valid = false; break; }
          if (valid && (last || rest === 0)) {
            var key = 0;
            for (var z = 0; z < pr.nCat; z++) key = key * N + baseCards[z];
            if (!red.excluded.has(key)) comps.push(E);
          }
          e = nEC - 1;
          while (e >= 0) { ci2[e]++; if (ci2[e] < cands[e].length) break; ci2[e] = 0; e--; }
          if (e < 0) break;
        }
      }
      var Ech = comps[Math.floor(rand() * comps.length)];
      var x = Ech; while (x) { var b = x & -x; row[red.cardOfBit[31 - Math.clz32(b)]] = ENV; x ^= b; }
      if (last) assignHand(row, last, R & ~Ech, red, rand);
      // walk back through forward players
      for (var i = ex.fwd.length; i >= 1; i--) {
        var pl = ex.fwd[i - 1], prevT = ex.tables[i - 1];
        var pos = bitList(M & pl.allowed);
        var need = binom(pos.length, pl.need);
        var buf = need <= ex.buf.length ? ex.buf : (ex.buf = new Int32Array(need));
        var n = combosInto(pos, pl.need, pl.clauses, buf, 0);
        var tot = 0, wts = new Float64Array(n);
        for (var h = 0; h < n; h++) {
          var sl = prevT.find(M & ~buf[h]);
          wts[h] = sl >= 0 ? prevT.f[sl] : 0;
          tot += wts[h];
        }
        var rr = rand() * tot, pick = 0;
        for (h = 0; h < n; h++) { rr -= wts[h]; if (rr < 0) { pick = h; break; } pick = h; }
        while (wts[pick] === 0 && pick > 0) pick--;
        var H = buf[pick];
        assignHand(row, pl, H, red, rand);
        M &= ~H;
      }
    }
    return { samples: out, n: nSamples };
  }

  // ---------------------------------------------------------- MCMC fallback
  function mcmcSolve(pr, red, opts, rand) {
    var nSamples = opts.samples || 3000;
    var full = red.full, u = red.u;
    var owners = red.players.map(function (pl) { return { p: pl.p, need: pl.need, F: pl.F, clauses: pl.clauses, env: false }; });
    if (red.envCats.length) owners.push({ p: pr.ENV, need: red.envCats.length, env: true });
    var nO = owners.length;
    var envAll = 0;
    red.envCats.forEach(function (ec) { envAll |= ec.cand; });
    var baseCards = red.envKnown.slice();
    function validEnv(S) {
      if (S & ~envAll) return false;
      for (var e = 0; e < red.envCats.length; e++) {
        var x = S & red.envCats[e].cand;
        if (!x || (x & (x - 1))) return false;
        baseCards[red.envCats[e].ci] = red.cardOfBit[31 - Math.clz32(x)];
      }
      var key = 0;
      for (var z = 0; z < pr.nCat; z++) key = key * pr.N + baseCards[z];
      return !red.excluded.has(key);
    }
    function valid(o, S) {
      if (o.env) return validEnv(S);
      if (S & o.F) return false;
      for (var q = 0; q < o.clauses.length; q++) if ((S & o.clauses[q]) === 0) return false;
      return true;
    }
    function randBit(x) { var l = bitList(x); return l.length ? 1 << l[Math.floor(rand() * l.length)] : 0; }
    function init() {
      var order = owners.slice().sort(function (a, b) {
        if (a.env !== b.env) return a.env ? -1 : 1;
        return popcount(full & ~(a.F || 0)) - popcount(full & ~(b.F || 0));
      });
      for (var attempt = 0; attempt < 4000; attempt++) {
        var rem = full, hands = new Array(nO), ok = true;
        for (var oi = 0; oi < order.length && ok; oi++) {
          var o = order[oi], S = 0, idx = owners.indexOf(o);
          if (oi === order.length - 1) S = rem;
          else if (o.env) {
            for (var e = 0; e < red.envCats.length; e++) {
              var bt = randBit(rem & red.envCats[e].cand);
              if (!bt) { ok = false; break; }
              S |= bt;
            }
          } else {
            var avail = rem & ~o.F;
            var cl = o.clauses.slice().sort(function () { return rand() - 0.5; });
            for (var q = 0; q < cl.length; q++) {
              if (S & cl[q]) continue;
              var b2 = randBit(cl[q] & avail & ~S);
              if (!b2) { ok = false; break; }
              S |= b2;
            }
            while (ok && popcount(S) < o.need) {
              var b3 = randBit(avail & ~S);
              if (!b3) { ok = false; break; }
              S |= b3;
            }
            if (popcount(S) > o.need) ok = false;
          }
          if (!ok) break;
          if (!valid(o, S) || popcount(S) !== o.need) { ok = false; break; }
          hands[idx] = S; rem &= ~S;
        }
        if (ok && rem === 0) return hands;
      }
      return null;
    }
    var chains = 4, perChain = Math.ceil(nSamples / chains);
    var N = pr.N, P = pr.P;
    var base = new Int8Array(N);
    for (var c = 0; c < N; c++) {
      if (pr.pub[c]) { base[c] = PUBLIC; continue; }
      base[c] = -1;
      for (var o2 = 0; o2 <= P; o2++) if (pr.K[o2 * N + c] === YES) { base[c] = o2; break; }
    }
    var out = new Int8Array(chains * perChain * N), got = 0;
    var thin = Math.max(2, nO), burn = 400 * nO;
    var splitBuf = new Int32Array(4000);
    for (var ch = 0; ch < chains; ch++) {
      var hands = init();
      if (!hands) continue;
      var moves = burn + perChain * thin;
      for (var mv = 0; mv < moves; mv++) {
        if (nO >= 2) {
          var a = Math.floor(rand() * nO), bI = Math.floor(rand() * (nO - 1));
          if (bI >= a) bI++;
          var A = owners[a], B = owners[bI];
          var pool = hands[a] | hands[bI], pc = popcount(pool);
          if (binom(pc, A.need) <= 4000) {
            var n = combosInto(bitList(pool), A.need, [], splitBuf, 0);
            var chosen = -1, seen = 0;
            for (var h = 0; h < n; h++) {
              var SA = splitBuf[h], SB = pool & ~SA;
              if (valid(A, SA) && valid(B, SB)) { seen++; if (rand() * seen < 1) chosen = SA; }
            }
            if (chosen !== -1) { hands[a] = chosen; hands[bI] = pool & ~chosen; }
          } else {
            var xa = randBit(hands[a]), xb = randBit(hands[bI]);
            if (rand() < 0.5) { xa |= randBit(hands[a] & ~xa); xb |= randBit(hands[bI] & ~xb); }
            if (popcount(xa) === popcount(xb)) {
              var NA = (hands[a] & ~xa) | xb, NB = (hands[bI] & ~xb) | xa;
              if (valid(A, NA) && valid(B, NB)) { hands[a] = NA; hands[bI] = NB; }
            }
          }
        }
        if (mv >= burn && (mv - burn) % thin === 0 && got < chains * perChain) {
          var row = out.subarray(got * N, got * N + N);
          row.set(base);
          for (var oi = 0; oi < nO; oi++) {
            var x = hands[oi];
            while (x) { var b = x & -x; row[red.cardOfBit[31 - Math.clz32(b)]] = owners[oi].p; x ^= b; }
          }
          got++;
        }
      }
    }
    if (!got) return null;
    return { samples: out.subarray(0, got * N), n: got };
  }

  // ------------------------------------------------------------ analyze
  function blankResult(pr) {
    return {
      ok: true, contradiction: null, method: 'logic', N: pr.N, P: pr.P, ENV: pr.ENV,
      prob: new Float64Array(pr.O * pr.N), known: new Int8Array(pr.K), triples: [], nSolutions: 0,
      deals: 0, samples: new Int8Array(0), nSamples: 0, ms: 0

  }

  function fillFromKnown(res, pr) {
    var N = pr.N;
    for (var o = 0; o < pr.O; o++) for (var c = 0; c < N; c++) {
      var v = res.known[o * N + c];
      if (v === YES) res.prob[o * N + c] = 1;
      else if (v === NO) res.prob[o * N + c] = 0;
    }
  }

  function analyze(game, opts) {
    var t0 = now();
    opts = opts || {};
    var err = validateSetup(game);
    if (err) return { ok: false, configError: err };
    var pr = compile(game, opts.upto);
    if (!pr.contradiction) propagate(pr);
    var res = blankResult(pr);
    if (pr.contradiction) {
      res.ok = false; res.contradiction = pr.contradiction; res.ms = now() - t0;
      return res;
    }
    res.known = new Int8Array(pr.K);
    var red = reduce(pr);
    var N = pr.N, P = pr.P, ENV = pr.ENV;
    var seed = opts.seed != null ? opts.seed : hashString(JSON.stringify(game.events || []) + '|' + (game.myCards || []).join(','));
    var rand = makeRng(seed);
    var nSamples = opts.samples == null ? 3000 : opts.samples;
    var ex = (!red.tooBig && !opts.forceSampling) ? exactSolve(pr, red, opts) : null;
    var c, o, b;
    if (ex) {
      if (ex.total === 0) {
        res.ok = false; res.contradiction = { event: null, reason: 'No deal of the cards is consistent with everything logged.' };
        res.ms = now() - t0;
        return res;
      }
      res.method = 'exact';
      res.deals = ex.total * ex.multiplier;
      var tot = ex.total;
      fillFromKnown(res, pr);
      var margBy = {};
      ex.fwd.concat(ex.last ? [ex.last] : []).forEach(function (pl) {
        if (!pl.members) { margBy[pl.p] = pl.marg; return; }
        pl.members.forEach(function (mb) {
          var mm = new Float64Array(pl.marg.length);
          for (var q = 0; q < mm.length; q++) mm[q] = (pl.marg[q] * mb.need) / pl.need;
          margBy[mb.p] = mm;
        });
      });
      for (b = 0; b < red.u; b++) {
        c = red.cardOfBit[b];
        for (o = 0; o < P; o++) res.prob[o * N + c] = margBy[o] ? margBy[o][b] / tot : 0;
        res.prob[ENV * N + c] = ex.margEnv[b] / tot;
        // exact zero counts give logical certainty
        var nz = 0, who = -1;
        for (o = 0; o <= P; o++) {
          var cnt = o === ENV ? ex.margEnv[b] : (margBy[o] ? margBy[o][b] : 0);
          if (cnt > 0) { nz++; who = o; } else res.known[o * N + c] = NO;
        }
        if (nz === 1) { res.known[who * N + c] = YES; for (o = 0; o <= P; o++) res.prob[o * N + c] = o === who ? 1 : 0; }
      }
      var trip = [];
      if (ex.tripleW) {
        for (var k = 0; k < ex.tripleW.length; k++) if (ex.tripleW[k] > 0) trip.push({ key: k, w: ex.tripleW[k] });
      } else ex.tripleMap.forEach(function (w, k2) { if (w > 0) trip.push({ key: k2, w: w }); });
      trip.sort(function (a, b2) { return b2.w - a.w; });
      res.nSolutions = trip.length;
      res.triples = trip.slice(0, opts.topTriples || 60).map(function (t) { return { cards: keyToCards(t.key, pr), p: t.w / tot }; });
      if (nSamples > 0) {
        var sm = sampleExact(pr, red, ex, nSamples, rand);
        res.samples = sm.samples; res.nSamples = sm.n;
      }
      res.work = ex.work;
    } else {
      // sampling fallback
      var mc = red.tooBig ? null : mcmcSolve(pr, red, { samples: Math.max(nSamples, 4000) }, rand);
      fillFromKnown(res, pr);
      if (mc && mc.n) {
        res.method = 'sampled';
        var S = mc.samples, n = mc.n;
        var counts = new Float64Array(pr.O * N), tmap = new Map();
        for (var i = 0; i < n; i++) {
          var tk = 0, env = new Array(pr.nCat);
          for (c = 0; c < N; c++) {
            var ow = S[i * N + c];
            if (ow >= 0) counts[ow * N + c]++;
            if (ow === ENV) env[pr.cardCat[c]] = c;
          }
          for (var z = 0; z < pr.nCat; z++) tk = tk * N + env[z];
          tmap.set(tk, (tmap.get(tk) || 0) + 1);
        }
        for (c = 0; c < N; c++) {
          if (pr.pub[c]) continue;
          var isKnown = false;
          for (o = 0; o <= P; o++) if (res.known[o * N + c] === YES) isKnown = true;
          if (isKnown) continue;
          for (o = 0; o <= P; o++) res.prob[o * N + c] = res.known[o * N + c] === NO ? 0 : counts[o * N + c] / n;
        }
        var tl = [];
        tmap.forEach(function (w, k3) { tl.push({ key: k3, w: w }); });
        tl.sort(function (a, b3) { return b3.w - a.w; });
        res.nSolutions = tl.length;
        res.triples = tl.slice(0, opts.topTriples || 60).map(function (t) { return { cards: keyToCards(t.key, pr), p: t.w / n }; });
        res.samples = S; res.nSamples = n;

  }

  // Find the first event that makes the log inconsistent (-1 = setup itself).
  function findContradiction(game, opts) {
    opts = Object.assign({ samples: 0 }, opts || {});

    function bad(n) { var r = analyze(game, Object.assign({}, opts, { upto: n })); return r.ok === false && !!r.contradiction; }
    if (bad(0)) return -1;
    if (!bad(events.length)) return null;
    // constraints only accumulate, so inconsistency is monotone: binary search
    var lo = 1, hi = events.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (bad(mid)) hi = mid; else lo = mid + 1; }

  // -------------------------------------------------- suggestion ranking
  // Expected information gain (bits) about the envelope from making a
  // suggestion yourself, estimated over exact posterior samples. Refuters
  // holding several of the cards are assumed to pick one uniformly.
  function rankSuggestions(game, res, opts) {
    opts = opts || {};

    var ix = cardIndex(game);
    var N = ix.N, P = game.players.length, ENV = P, nCat = ix.nCat;
    var me = opts.suggester != null ? opts.suggester : game.me;
    var S = res.samples, nS = res.nSamples;
    var order = [];
    for (var i = 1; i < P; i++) order.push((me + i) % P);
    var envCard = new Int16Array(nS * nCat);
    for (var k = 0; k < nS; k++) for (var c = 0; c < N; c++) if (S[k * N + c] === ENV) envCard[k * nCat + ix.cardCat[c]] = c;
    function entropyOf(row, off, total) {
      var H = 0;
      for (var ci = 0; ci < nCat; ci++) {
        var cl = ix.catCards[ci];
        for (var j = 0; j < cl.length; j++) {
          var w = row[off + cl[j]];
          if (w > 0) { var p = w / total; H -= p * Math.log2(p); }
        }
      }
      return H;
    }
    var prior = new Float64Array(N);
    for (k = 0; k < nS; k++) for (var z = 0; z < nCat; z++) prior[envCard[k * nCat + z]]++;
    var Hprior = entropyOf(prior, 0, nS);
    var cats = ix.catCards;
    var lists = [opts.suspects || cats[0], opts.weapons || cats[1], opts.rooms || cats[2]];
    var nOut = 1 + order.length * 3;
    var hist = new Float64Array(nOut * N), outW = new Float64Array(nOut);
    var results = [];
    for (var a = 0; a < lists[0].length; a++) for (var b = 0; b < lists[1].length; b++) for (var r = 0; r < lists[2].length; r++) {
      var X0 = lists[0][a], X1 = lists[1][b], X2 = lists[2][r];
      hist.fill(0); outW.fill(0);
      for (k = 0; k < nS; k++) {
        var base = k * N, o0 = S[base + X0], o1 = S[base + X1], o2 = S[base + X2];
        var eo = k * nCat, oc = -1;
        for (var t = 0; t < order.length; t++) {
          var q = order[t];
          var m0 = o0 === q ? 1 : 0, m1 = o1 === q ? 1 : 0, m2 = o2 === q ? 1 : 0;
          var cnt = m0 + m1 + m2;
          if (cnt) {
            var wt = 1 / cnt, ob = 1 + t * 3;
            if (m0) { outW[ob] += wt; for (z = 0; z < nCat; z++) hist[ob * N + envCard[eo + z]] += wt; }
            if (m1) { outW[ob + 1] += wt; for (z = 0; z < nCat; z++) hist[(ob + 1) * N + envCard[eo + z]] += wt; }
            if (m2) { outW[ob + 2] += wt; for (z = 0; z < nCat; z++) hist[(ob + 2) * N + envCard[eo + z]] += wt; }
            oc = t;
            break;
          }
        }
        if (oc < 0) { outW[0] += 1; for (z = 0; z < nCat; z++) hist[envCard[eo + z]] += 1; }
      }
      var Hpost = 0;
      for (var o = 0; o < nOut; o++) if (outW[o] > 0) Hpost += (outW[o] / nS) * entropyOf(hist, o * N, outW[o]);
      var byPlayer = [];
      for (t = 0; t < order.length; t++) {
        var pw = outW[1 + t * 3] + outW[2 + t * 3] + outW[3 + t * 3];
        if (pw > 0) byPlayer.push({ player: order[t], p: pw / nS });
      }
      results.push({ cards: [X0, X1, X2], eig: Math.max(0, Hprior - Hpost), pNone: outW[0] / nS, byPlayer: byPlayer });
    }
    results.sort(function (x, y) { return y.eig - x.eig || y.pNone - x.pNone; });
    return { prior: Hprior, list: results };
  }

  return {
    UNKNOWN: UNKNOWN, NO: NO, YES: YES, PUBLIC: PUBLIC,
    analyze: analyze, findContradiction: findContradiction, rankSuggestions: rankSuggestions,
    validateSetup: validateSetup, cardIndex: cardIndex,
    // exposed for tests
    _compile: compile, _propagate: propagate, _reduce: reduce, _popcount: popcount, _binom: binom, _makeRng: makeRng
  };
});

    var thead = h('thead', null, h('tr', null, h('th', { class: 'card', scope: 'col' }, ''), cols.map(function (o) {
      var label = o === ENV ? 'Envelope' : (o === g.me ? 'You' : g.players[o].name);
      return h('th', { scope: 'col', class: o === ENV ? 'env' : '', title: label }, o === ENV ? 'Env.' : label.slice(0, 5));
    })));
    table.appendChild(thead);
    var tb = h('tbody');
    g.categories.forEach(function (cat, ci) {
      add(tb, h('tr', { class: 'cat' }, h('th', { colspan: cols.length + 1 }, cat.name + 's')));
      d.byCat[ci].forEach(function (c) {
        var solved = A.known[ENV * N + c] === E.YES;
        var mine = g.myCards.indexOf(c) >= 0;
        var tr = h('tr', { class: (solved ? 'solved ' : '') + (mine ? 'mine' : '') });
        add(tr, h('th', { class: 'card', scope: 'row' }, h('button', { onclick: function () { S.modal = { kind: 'card', card: c }; renderModal(); } }, d.names[c])));
        cols.forEach(function (o) {
          var k = A.known[o * N + c], p = A.prob[o * N + c];
          var isEnv = o === ENV;
          var cell;
          if ((g.faceUp || []).indexOf(c) >= 0) cell = h('div', { class: 'cell no', title: 'Face up' }, '—');
          else if (k === E.YES) cell = h('div', { class: 'cell yes' + (isEnv ? ' env' : ''), title: 'Certain' }, '✓');
          else if (k === E.NO) cell = h('div', { class: 'cell no', title: 'Ruled out' }, '×');
          else {
            var tint = isEnv ? 'var(--stamp)' : 'var(--felt)';
            var a = Math.round(8 + p * 52);
            cell = h('div', { class: 'cell', style: 'background:color-mix(in srgb, ' + tint + ' ' + a + '%, transparent)' + (p > 0.6 ? ';color:#fff' : ''), title: pct(p) }, Math.round(p * 100) < 1 ? '<1' : String(Math.round(p * 100)));
          }
          add(tr, h('td', null, cell));
        });
        add(tb, tr);
      });
    });
    table.appendChild(tb);
    nodes.push(h('section', { class: 'sheet' },
      h('div', { class: 'row between' }, h('h2', null, 'Detective notes'), h('span', { class: 'tiny muted' }, 'Tap a card for details')),
      h('div', { class: 'legend' },
        h('span', null, h('span', { class: 'cell yes' }, '✓'), ' certain'),
        h('span', null, h('span', { class: 'cell no' }, '×'), ' ruled out'),
        h('span', null, h('span', { class: 'cell', style: 'background:color-mix(in srgb, var(--felt) 30%, transparent)' }, '42'), ' % chance'),
        h('span', { style: 'color:var(--felt);font-weight:600' }, 'Green name = your card')),
      h('div', { class: 'grid-wrap' }, table)));
    return nodes;
  }

  // ------------------------------------------------------------ advice
  function viewAdvice() {
    var A = S.analysis, g = S.game, d = deck(g);
    var nodes = [contradictionBanner()];
    if (!A || A.ok === false) { nodes.push(h('section', { class: 'sheet' }, h('p', { class: 'muted', style: 'margin:0' }, A ? 'Fix the log to get advice.' : 'Solving…'))); return nodes; }
    var info = solvedInfo(), N = A.N, ENV = A.ENV;

    // accusation verdict
    var top = A.triples[0];
    var acc = h('section', { class: 'sheet' }, h('h2', null, 'Should you accuse?'));
    if (info.solved) {
      add(acc, h('div', { class: 'banner good' }, h('div', { class: 'grow' }, h('b', null, 'Yes — this is certain.'),
        info.slots.map(function (s) { return d.names[s.card]; }).join(' · '))));
    } else if (top) {
      var p = top.p;
      var verdictText = p >= S.settings.alertAt
        ? 'Strong lead. You’d be right ' + pct(p) + ' of the time. Accuse if an opponent looks close to solving it; otherwise one more suggestion could make it certain.'
        : 'Not yet. The best guess is right only ' + pct(p) + ' of the time, and a wrong accusation knocks you out.';
      add(acc, h('div', { class: 'verdict' }, h('span', { class: 'big', style: p >= S.settings.alertAt ? 'color:var(--brass)' : '' }, pct(p)), h('span', { class: 'small' }, top.cards.map(function (c) { return d.names[c]; }).join(' · '))));
      add(acc, h('p', { class: 'small', style: 'margin:0' }, verdictText));
    }
    var slider = h('input', { type: 'range', id: 'alertAt', min: '50', max: '100', step: '5', value: String(Math.round(S.settings.alertAt * 100)), style: 'width:100%', oninput: function (e) { S.settings.alertAt = Number(e.target.value) / 100; lbl.textContent = e.target.value + '%'; }, onchange: function () { render(); } });
    var lbl = h('span', { class: 'num' }, Math.round(S.settings.alertAt * 100) + '%');
    add(acc, h('label', { class: 'stack', style: 'gap:4px' }, h('span', { class: 'field-label' }, 'Flag a strong lead at', lbl), slider));
    nodes.push(acc);

    // envelope per category
    var env = h('section', { class: 'sheet' }, h('h2', null, 'What’s in the envelope'));
    g.categories.forEach(function (cat, ci) {
      var list = d.byCat[ci].map(function (c) { return { c: c, p: A.prob[ENV * N + c], k: A.known[ENV * N + c] }; }).sort(function (a, b) { return b.p - a.p; });
      var alive = list.filter(function (x) { return x.p > 0; }), dead = list.length - alive.length;
      add(env, h('div', { class: 'stack' },
        h('div', { class: 'row between' }, h('h3', null, cat.name), h('span', { class: 'tiny muted' }, dead + ' of ' + list.length + ' ruled out')),
        h('div', { class: 'bars' }, alive.map(function (x) {
          return h('div', { class: 'bar' }, h('span', { class: 'lbl' }, d.names[x.c]), h('span', { class: 'val' }, x.k === E.YES ? '100%' : pct(x.p)),
            h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (x.p * 100).toFixed(1) + '%' })));
        }))));
    });
    nodes.push(env);

    // top combos
    if (!info.solved && A.triples.length > 1) {
      nodes.push(h('section', { class: 'sheet' }, h('div', { class: 'row between' }, h('h2', null, 'Most likely combinations'), h('span', { class: 'tiny muted' }, A.nSolutions + ' still possible')),
        h('div', { class: 'bars' }, A.triples.slice(0, 6).map(function (t) {
          return h('div', { class: 'bar' }, h('span', { class: 'lbl' }, t.cards.map(function (c) { return d.names[c]; }).join(' · ')), h('span', { class: 'val' }, pct(t.p)),
            h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + (t.p * 100).toFixed(1) + '%' })));
        }))));
    }

    // next suggestion
    if (!info.solved) nodes.push(viewSuggest());

    nodes.push(h('p', { class: 'tiny muted', style: 'margin:0 4px' },
      A.method === 'exact' ? 'Exact: counted all ' + fmtBig(A.deals) + ' deals that fit your log (' + Math.round(A.ms) + ' ms).'
        : A.method === 'sampled' ? 'Estimated from ' + A.nSamples.toLocaleString() + ' random deals that fit your log (this deck is too big to count exactly yet). Certain ✓ / × marks are still exact.'
          : 'Logic only.'));
    return nodes;
  }

  function viewSuggest() {
    var g = S.game, d = deck(g);
    var box = h('section', { class: 'sheet' }, h('h2', null, 'Your next suggestion'),
      h('p', { class: 'small muted', style: 'margin:0' }, 'Ranked by how much each one is expected to narrow down the envelope. You can only suggest the room you are standing in.'));
    var rooms = d.byCat[2];
    add(box, h('div', { class: 'stack' }, h('span', { class: 'field-label' }, 'Which room are you in?'),
      h('div', { class: 'chips' }, h('button', { class: 'chip', 'aria-pressed': S.rankRoom === -1 ? 'true' : 'false', onclick: function () { S.rankRoom = -1; S.rank = null; render(); requestRank(); } }, 'Any room'),
        rooms.map(function (r) { return h('button', { class: 'chip', 'aria-pressed': S.rankRoom === r ? 'true' : 'false', onclick: function () { S.rankRoom = r; S.rank = null; render(); requestRank(); } }, d.names[r]); }))));
    var RR = S.rank && S.rank.room === S.rankRoom ? S.rank : null;
    if (!RR) { add(box, h('p', { class: 'small muted', style: 'margin:0' }, 'Working it out…')); if (!S.rankBusy) setTimeout(requestRank, 0); return box; }
    var R = RR.data;
    if (!R || !R.top) { add(box, h('p', { class: 'small muted', style: 'margin:0' }, 'Suggestion ranking isn’t available for this game.')); return box; }
    var best = R.top[0] ? R.top[0].eig : 0;
    if (!best) { add(box, h('p', { class: 'small', style: 'margin:0' }, 'No suggestion here can teach you anything new about the envelope. Try another room.')); }
    var list = h('div', { class: 'sugg' }, R.top.slice(0, 5).map(function (it, i) {
      var who = it.byPlayer.slice().sort(function (a, b) { return b.p - a.p; })[0];
      var mineCount = it.cards.filter(function (c) { return g.myCards.indexOf(c) >= 0; }).length;
      return h('div', { class: 'sg' },
        h('div', { class: 'row between', style: 'flex-wrap:nowrap' }, h('span', { class: 'title' }, it.cards.map(function (c) { return d.names[c]; }).join(' · ')), h('span', { class: 'bits' }, it.eig.toFixed(2) + ' bits')),
        h('div', { class: 'meter' }, h('i', { style: 'width:' + (best ? (it.eig / best * 100).toFixed(0) : 0) + '%' })),
        h('div', { class: 'meta' },
          h('span', null, 'No one shows: ' + pct(it.pNone)),
          who ? h('span', null, 'Likely shown by ' + shortName(who.player) + ' (' + pct(who.p) + ')') : null,
          mineCount ? h('span', null, 'uses ' + mineCount + ' of your cards') : null));
    }));
    add(box, list);
    if (S.rankRoom === -1 && R.rooms && R.rooms.length) {
      add(box, h('div', { class: 'stack' }, h('span', { class: 'field-label' }, 'Best rooms to head for'),
        h('div', { class: 'bars' }, R.rooms.slice(0, 4).map(function (it) {
          return h('div', { class: 'bar' }, h('span', { class: 'lbl' }, d.names[it.cards[2]]), h('span', { class: 'val' }, it.eig.toFixed(2)),
            h('div', { class: 'track' }, h('div', { class: 'fill', style: 'background:var(--felt);width:' + (best ? (it.eig / best * 100).toFixed(0) : 0) + '%' })));
        }))));
    }
    add(box, h('p', { class: 'tiny muted', style: 'margin:0' }, 'A “bit” of information halves the remaining uncertainty. Suggesting one of your own cards is a classic trick: no one else can show it, so it focuses the answer on the other two.'));
    return box;
  }

  // ----------------------------------------------------------- history
  function viewHistory() {
    var g = S.game, evs = g.events || [];
    var nodes = [contradictionBanner()];
    var sec = h('section', { class: 'sheet' }, h('div', { class: 'row between' }, h('h2', null, 'Log · ' + evs.length + ' entr' + (evs.length === 1 ? 'y' : 'ies')),
      evs.length ? h('button', { class: 'linkish', onclick: function () { var e = evs.pop(); toast('Removed entry #' + (evs.length + 1)); render(); analyze(); } }, 'Undo last') : null));
    if (!evs.length) add(sec, h('p', { class: 'muted small', style: 'margin:0' }, 'Nothing logged yet. Entries you save on the Log turn tab appear here, newest first.'));
    var list = h('div', { class: 'hist' });
    for (var i = evs.length - 1; i >= 0; i--) (function (i) {
      var ev = evs[i];
      var bad = S.culprit === i;
      var confirming = S.confirmDel === ev.id;
      add(list, h('div', { class: 'ev' + (bad ? ' bad' : '') },
        h('span', { class: 'n' }, '#' + (i + 1)),
        h('div', { class: 'body' }, describe(ev), bad ? h('div', { class: 'small', style: 'color:var(--stamp);font-weight:600' }, 'This entry conflicts with the ones before it.') : null),
        h('div', { class: 'acts' },
          h('button', { class: 'linkish', onclick: function () { S.editingId = ev.id; S.form = eventToForm(ev); S.tab = 'log'; render(); window.scrollTo(0, 0); } }, 'Edit'),
          confirming
            ? h('button', { class: 'linkish', style: 'color:var(--stamp)', onclick: function () { evs.splice(i, 1); S.confirmDel = null; toast('Entry deleted'); render(); analyze(); } }, 'Confirm')
            : h('button', { class: 'linkish', style: 'color:var(--muted)', onclick: function () { S.confirmDel = ev.id; render(); } }, 'Delete'))));
    })(i);
    add(sec, list);
    nodes.push(sec);
    return nodes;
  }

  // ------------------------------------------------------------- modal
  var modalRoot = document.createElement('div');
  document.body.appendChild(modalRoot);
  function closeModal() { S.modal = null; renderModal(); }
  function renderModal() {
    modalRoot.innerHTML = '';
    if (!S.modal) return;
    var m = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'grab' }));
    var scrim = h('div', { class: 'scrim', onclick: function (e) { if (e.target === scrim) closeModal(); } }, m);
    var g = S.game;
    if (S.modal.kind === 'menu') {
      add(m, h('h3', null, 'Case menu'),
        h('button', { class: 'btn block', onclick: function () { S.game0 = S.game; S.setup = S.game.setup ? JSON.parse(JSON.stringify(S.game.setup)) : setupFromGame(S.game); S.game = null; S.modal = null; render(); } }, 'Edit setup (players, your cards)'),
        h('button', { class: 'btn block', onclick: function () { S.modal = { kind: 'export' }; renderModal(); } }, 'Export / import game'),
        h('button', { class: 'btn block', onclick: function () { S.modal = { kind: 'about' }; renderModal(); } }, 'How the solver works'),
        S.modal.confirmNew
          ? h('button', { class: 'btn block danger', onclick: function () { var keep = S.game.setup; S.game = null; S.setup = keep ? JSON.parse(JSON.stringify(keep)) : null; if (S.setup) { S.setup.myCards = []; S.setup.faceUp = []; } S.analysis = null; S.modal = null; S.form = null; render(); } }, 'Tap again to discard this game')
          : h('button', { class: 'btn block danger', onclick: function () { S.modal.confirmNew = true; renderModal(); } }, 'New game'),
        h('button', { class: 'btn block', onclick: closeModal }, 'Close'));
    } else if (S.modal.kind === 'card') {
      var A = S.analysis, c = S.modal.card, d = deck(g), N = A.N, ENV = A.ENV;
      var owners = g.players.map(function (_, i) { return i; }).concat([ENV]);
      var rel = (g.events || []).map(function (ev, i) { return { ev: ev, i: i }; }).filter(function (x) {

        return (ev.cards && ev.cards.indexOf(c) >= 0) || ev.card === c;
      });
      add(m, h('h3', null, d.names[c]),
        h('div', { class: 'bars' }, owners.map(function (o) {
          var p = A.prob[o * N + c], k = A.known[o * N + c];
          return h('div', { class: 'bar' + (k === E.NO ? ' out' : '') }, h('span', { class: 'lbl' }, o === ENV ? 'Envelope' : playerName(o)), h('span', { class: 'val' }, k === E.YES ? '✓ 100%' : k === E.NO ? '×' : pct(p)),
            h('div', { class: 'track' }, h('div', { class: 'fill', style: 'background:' + (o === ENV ? 'var(--stamp)' : 'var(--felt)') + ';width:' + (p * 100).toFixed(1) + '%' })));
        })),
        rel.length ? h('div', { class: 'stack' }, h('span', { class: 'field-label' }, 'Entries mentioning it'),
          h('div', { class: 'hist' }, rel.slice(-6).reverse().map(function (x) { return h('div', { class: 'ev' }, h('span', { class: 'n' }, '#' + (x.i + 1)), h('div', { class: 'body small' }, describe(x.ev))); }))) : null,
        h('button', { class: 'btn block', onclick: function () { S.form = blankForm('fact'); S.form.card = c; S.tab = 'log'; S.modal = null; render(); } }, 'Note who has this card'),
        h('button', { class: 'btn block', onclick: closeModal }, 'Close'));
    } else if (S.modal.kind === 'export') {
      var ta = h('textarea', { id: 'export-json', rows: 8, 'aria-label': 'Game data' }, JSON.stringify(S.game));
      add(m, h('h3', null, 'Export / import'),
        h('p', { class: 'small muted', style: 'margin:0' }, 'Copy this text to back up the game or move it to another device. To import, paste a saved game over it and tap Load.'),
        ta,
        h('div', { class: 'row', style: 'flex-wrap:nowrap' },
          h('button', { class: 'btn block', onclick: function () {
            var txt = ta.value;
            try { navigator.clipboard.writeText(txt).then(function () { toast('Copied'); }, function () { ta.select(); toast('Select-all done — copy it manually'); }); }
            catch (e) { ta.select(); toast('Select-all done — copy it manually'); }
          } }, 'Copy'),
          h('button', { class: 'btn primary block', onclick: function () {
            try {
              var gg = JSON.parse(ta.value);
              var err = E.validateSetup(gg);
              if (err) { toast(err); return; }
              (gg.events || []).forEach(function (e) { if (!e.id) e.id = uid(); });
              S.game = gg; S.modal = null; S.form = null; render(); analyze(); toast('Game loaded');
            } catch (e) { toast('That isn’t a saved game.'); }
          } }, 'Load')),
        h('button', { class: 'btn block', onclick: closeModal }, 'Close'));
    } else if (S.modal.kind === 'about') {
      add(m, h('h3', null, 'How the solver works'), h('div', { class: 'prose small' },
        h('p', null, 'Every logged entry is a hard fact about the deal: a player who passed holds none of the three cards; a player who showed holds at least one (exactly the one, if you saw it); a wrong accusation rules out that combination; hand sizes are fixed.'),
        h('p', null, 'The solver counts every way the cards could have been dealt that fits all of those facts. Since the shuffle is random, each of those deals is equally likely. Each percentage is the share of fitting deals where that card is in that place, counted exactly with dynamic programming rather than estimated.'),
        h('p', null, 'This catches deductions a paper notepad misses: hand-size squeezes, chains of “showed one of these three”, and cards that must be in the envelope because nobody has room for them.'),
        h('p', null, 'Suggestions are ranked by expected information gain: for each possible suggestion it simulates who would show what across thousands of exact random deals, and measures how much the envelope odds would sharpen.'),
        h('p', null, 'Unofficial, fan-made tool. Not affiliated with the makers of Clue or Cluedo.'),
        h('p', null, 'Assumptions: players never make mistakes when showing or passing, and when someone holds several of the cards, which one they show tells you nothing extra. Bluffs in suggestions are ignored. A mis-logged entry shows up as a conflict, flagged in History.')),
        h('button', { class: 'btn block', onclick: closeModal }, 'Close'));
    }
    modalRoot.appendChild(scrim);
  }
  function setupFromGame(g) {
    return {
      edition: 'custom', cats: g.categories.map(function (c) { return { name: c.name, cards: c.cards.slice() }; }),
      players: g.players.map(function (p) { return { name: p.name, hand: p.hand }; }), me: g.me,
      faceUpMode: (g.faceUp || []).length > 0, myCards: g.myCards.slice(), faceUp: (g.faceUp || []).slice()
    };
  }

  var toastRoot = document.createElement('div');
  document.body.appendChild(toastRoot);
  function renderToast() {
    toastRoot.innerHTML = '';
    if (S.toast) toastRoot.appendChild(h('div', { class: 'toast', role: 'status' }, S.toast));
  }

  // ------------------------------------------------------------- boot
  restore();
  render();
  if (S.game) analyze();
})();
</script>
<script>
(function () {
  function note(msg, ms) {
    var d = document.createElement('div');
    d.setAttribute('role', 'status');
    d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 72px);z-index:60;' +
      'background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:10px;font-size:14px;line-height:1.35;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2);pointer-events:none';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, ms || 3500);
  }
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  window.addEventListener('load', function () {
    var firstInstall = !navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
      var told = false;
      function watch(w) {
        if (!w || w.__watched) return;
        w.__watched = true;
        w.addEventListener('statechange', function () {
          if (w.state === 'activated' && firstInstall && !told) { told = true; note('Saved on this device — it now works offline.'); }
        });
      }
      watch(reg.installing);
      reg.addEventListener('updatefound', function () { watch(reg.installing); });
    }).catch(function () { /* offline support unavailable here */ });
    try {
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
      if (ios && !standalone && !localStorage.getItem('clue-install-hint')) {
        localStorage.setItem('clue-install-hint', '1');
        setTimeout(function () { note('Tip: tap Share, then “Add to Home Screen” to install this as an app that works offline.', 7000); }, 1200);
      }
    } catch (e) { /* storage blocked */ }
  });
})();
</script>
